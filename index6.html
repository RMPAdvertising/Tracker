<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document status tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#262626;
    --ink-soft:#6E6E6C;
    --paper:#F1F0EE;
    --surface:#FFFFFF;
    --border:#E1DFDC;
    --border-strong:#C7C4C0;
    --brand:#CE1431;
    --brand-dark:#A5102A;
    --blue:#2E6F9E; --blue-bg:#E7F0F7;
    --amber:#B67A16; --amber-bg:#FBF0DD;
    --plum:#7A4B8C; --plum-bg:#F1E7F4;
    --green:#2F7D5A; --green-bg:#E5F2EB;
    --gray:#71767E; --gray-bg:#EFEFEE;
    --slate:#8C7A63; --slate-bg:#F1ECE6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Barlow",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 80px;}
  header.top{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
    border-bottom:3px solid var(--brand);
    padding-bottom:20px;margin-bottom:28px;
  }
  .brand-row{
    display:flex;align-items:center;gap:14px;
  }
  .logo{
    height:52px;width:auto;flex:none;
  }
  h1{
    font-family:"Barlow",sans-serif;
    font-weight:500;
    font-size:30px;
    margin:0 0 4px;
    letter-spacing:0em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .sub{color:var(--ink-soft);font-size:14px;margin:0;}
  .badge-readonly{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;color:var(--ink-soft);
    border:1px solid var(--border-strong);border-radius:99px;
    padding:5px 12px;white-space:nowrap;
  }
  .badge-readonly svg{flex:none;}

  /* pipeline overview */
  .pipeline{
    display:flex;border:1px solid var(--border);border-radius:12px;
    overflow:hidden;margin-bottom:24px;background:var(--surface);
    flex-wrap:wrap;
  }
  .stage{
    flex:1;min-width:140px;padding:16px 18px;position:relative;
    border-right:1px solid var(--border);
  }
  .stage:last-child{border-right:none;}
  .stage .count{
    font-family:"Barlow",sans-serif;font-weight:700;font-size:26px;line-height:1;
  }
  .stage .label{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .stage::after{
    content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;
  }
  .stage.blue::after{background:var(--blue);}
  .stage.amber::after{background:var(--amber);}
  .stage.plum::after{background:var(--plum);}
  .stage.green::after{background:var(--green);}
  .stage.gray::after{background:var(--gray);}
  .stage.slate::after{background:var(--slate);}

  /* filters */
  .filters{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;
  }
  .filters input[type=text], .filters select{
    font-family:inherit;font-size:13.5px;
    border:1px solid var(--border-strong);border-radius:8px;
    padding:8px 12px;background:var(--surface);color:var(--ink);
  }
  .filters input[type=text]{min-width:220px;}
  .filters .spacer{flex:1;}
  .filters .count-note{font-size:13px;color:var(--ink-soft);}

  /* document group tabs */
  .doc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .doc-tab{
    font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;
    border:1px solid var(--border-strong);border-radius:99px;
    padding:7px 16px;background:var(--surface);color:var(--ink-soft);
  }
  .doc-tab.active{background:var(--brand);color:#fff;border-color:var(--brand);}

  /* table */
  .table-scroll{
    border:1px solid var(--border);border-radius:12px;overflow:auto;
    background:var(--surface);
  }
  table{border-collapse:collapse;width:100%;font-size:13.5px;}
  thead th{
    position:sticky;top:0;background:var(--surface);
    text-align:left;padding:12px 14px;font-weight:500;color:var(--ink-soft);
    border-bottom:1px solid var(--border);white-space:nowrap;font-size:12.5px;
    text-transform:uppercase;letter-spacing:.03em;
  }
  tbody td{
    padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td.lang-col{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-soft);}
  tbody tr:hover td{background:#F6F7F5;}
  tbody tr:last-child td{border-bottom:none;}

  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:500;
    white-space:nowrap;
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .pill.blue{background:var(--blue-bg);color:var(--blue);}
  .pill.blue .dot{background:var(--blue);}
  .pill.amber{background:var(--amber-bg);color:var(--amber);}
  .pill.amber .dot{background:var(--amber);}
  .pill.plum{background:var(--plum-bg);color:var(--plum);}
  .pill.plum .dot{background:var(--plum);}
  .pill.green{background:var(--green-bg);color:var(--green);}
  .pill.green .dot{background:var(--green);}
  .pill.gray{background:var(--gray-bg);color:var(--gray);}
  .pill.gray .dot{background:var(--gray);}
  .pill.slate{background:var(--slate-bg);color:var(--slate);}
  .pill.slate .dot{background:var(--slate);}
  .empty-cell{color:var(--border-strong);}

  footer.note{
    margin-top:28px;font-size:12.5px;color:var(--ink-soft);text-align:center;
  }
</style>
</head>

, "status": "Being created by RMP"}, {"document": "VASS", "language": "PTEN", "status": "Fully approved", "approvedLocal": "Approved", "approvedPricing": "Approved"}, {"document": "VASS", "language": "PTPT", "status": "Being created by RMP"}, {"document": "VASS", "language": "ROEN", "status": "Being created by RMP"}, {"document": "VASS", "language": "RORO", "status": "Being created by RMP"}, {"document": "VASS", "language": "SEEN", "status": "Being created by RMP"}, {"document": "VASS", "language": "SESE", "status": "Fully approved", "approvedLocal": "Approved", "approvedPricing": "Approved"}, {"document": "VASS", "language": "SIEN", "status": "Being created by RMP"}, {"document": "VASS", "language": "SISI", "status": "Being created by RMP"}, {"document": "VASS", "language": "SKEN", "status": "Being created by RMP"}, {"document": "VASS", "language": "SKSK", "status": "To be reviewed"}, {"document": "VASS", "language": "TREN", "status": "Being created by RMP"}, {"document": "VASS", "language": "TRTR", "status": "Being created by RMP"}];

const STATUSES = [
  {label:"Being created by RMP", cls:"blue"},
  {label:"To be reviewed", cls:"amber"},
  {label:"Being amended by RMP", cls:"plum"},
  {label:"Fully Approved", cls:"green"},
  {label:"Not in scope", cls:"slate"}
];
function statusMeta(raw){
  const norm = (raw||"").toString().trim().toLowerCase();
  for(const s of STATUSES){ if(s.label.toLowerCase()===norm) return s; }
  if(norm.includes("not in scope")) return STATUSES[4];
  if(norm.includes("creat")) return STATUSES[0];
  if(norm.includes("review")) return STATUSES[1];
  if(norm.includes("amend")) return STATUSES[2];
  if(norm.includes("approv")) return STATUSES[3];
  return {label: raw||"Unknown", cls:"gray"};
}
function escapeHtml(str){
  return str.replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

const docs = [...new Set(DATA.map(r=>r.document))];
let activeDoc = docs[0];

const ALL_COUNTRIES = "All countries";
const COUNTRY_GROUPS = {
  "AT": ["ATDE","ATEN"],
  "BENELUX": ["BEEN","BEFR","BENL","LUEN","LUFR","NLNL","NLEN"],
  "BG": ["BGEN","BGBG"],
  "CH": ["CHDE","CHEN","CHFR","CHIT"],
  "CY": ["CYEN","CYCY"],
  "CZ": ["CZEN","CZCZ"],
  "DE": ["DEDE","DEEN"],
  "BALTICS": ["EEEE","EEEN","LTEN","LTLT","LVEN","LVLV","SISI","SIEN"],
  "ES": ["ESEN","ESES"],
  "FR": ["FREN","FRFR"],
  "GB": ["GBEN"],
  "GR": ["GREN","GRGR"],
  "HU": ["HUEN","HUHU"],
  "IE": ["IEEN"],
  "IL": ["ILEN ILS","ILEN USD","ILHE ILS","ILHE USD","ILEN","ILIL","ILHE"],
  "IT": ["ITEN","ITIT"],
  "NORDICS": ["DKDK","DKEN","FIEN","FIFI","NOEN","NONO","SEEN","SESE"],
  "PL": ["PLEN","PLPL"],
  "PT": ["PTEN","PTPT"],
  "RO": ["ROEN","RORO"],
  "SK": ["SKSK","SKEN"],
  "TR": ["TREN","TRTR"]
};
// map each 4-letter language prefix to its country group, longest codes first so
// e.g. "ILEN ILS" is matched before the plainer "ILEN"
const PREFIX_TO_GROUP = {};
Object.entries(COUNTRY_GROUPS).forEach(([group, codes])=>{
  codes.forEach(code=>{ PREFIX_TO_GROUP[code] = group; });
});
function countryGroupOf(language){
  const upper = language.toUpperCase();
  const sortedCodes = Object.keys(PREFIX_TO_GROUP).sort((a,b)=>b.length-a.length);
  for(const code of sortedCodes){
    if(upper===code || upper.startsWith(code+" ")) return PREFIX_TO_GROUP[code];
  }
  return null;
}
let activeCountry = ALL_COUNTRIES;

function renderCountryTabs(){
  const host = document.getElementById('countryTabs');
  const tabs = [ALL_COUNTRIES, ...Object.keys(COUNTRY_GROUPS)];
  host.innerHTML = tabs.map(c=>
    `<button class="doc-tab ${c===activeCountry?'active':''}" data-country="${c}">${c}</button>`
  ).join("");
  host.querySelectorAll('.doc-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCountry = btn.getAttribute('data-country');
      renderCountryTabs();
      renderTable();
    });
  });
}

function renderPipeline(records){
  const counts = {blue:0, amber:0, plum:0, green:0, slate:0, gray:0};
  records.forEach(r=>{ counts[statusMeta(r.status).cls]++; });
  const pipeline = document.getElementById('pipeline');
  pipeline.innerHTML = STATUSES.map(s=>`
    <div class="stage ${s.cls}">
      <div class="count">${counts[s.cls]}</div>
      <div class="label">${s.label}</div>
    </div>
  `).join("") + (counts.gray ? `
    <div class="stage gray">
      <div class="count">${counts.gray}</div>
      <div class="label">Other status</div>
    </div>` : "");
}

const ALL_DOCS = "All documents";

function renderDocTabs(){
  const host = document.getElementById('docTabs');
  const tabs = [ALL_DOCS, ...docs];
  host.innerHTML = tabs.map(d=>
    `<button class="doc-tab ${d===activeDoc?'active':''}" data-doc="${d}">${d}</button>`
  ).join("");
  host.querySelectorAll('.doc-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeDoc = btn.getAttribute('data-doc');
      renderAll();
    });
  });
}

function renderFilters(){
  const statusSel = document.getElementById('statusFilter');
  if(!statusSel.dataset.built){
    statusSel.innerHTML = `<option value="">All statuses</option>` +
      STATUSES.map(s=>`<option value="${s.label}">${s.label}</option>`).join("");
    statusSel.dataset.built = "1";
    statusSel.addEventListener('change', renderTable);
    document.getElementById('searchBox').addEventListener('input', renderTable);
  }
}

function renderTable(){
  const showAll = activeDoc === ALL_DOCS;
  const records = showAll ? DATA : DATA.filter(r=>r.document===activeDoc);
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const statusFilterVal = document.getElementById('statusFilter').value;

  let filtered = records.filter(r=>!search || r.language.toLowerCase().includes(search) || (showAll && r.document.toLowerCase().includes(search)));
  if(statusFilterVal){
    filtered = filtered.filter(r=>statusMeta(r.status).label===statusFilterVal);
  }
  if(activeCountry !== ALL_COUNTRIES){
    filtered = filtered.filter(r=>countryGroupOf(r.language)===activeCountry);
  }
  filtered = filtered.slice().sort((a,b)=> showAll
    ? (a.document.localeCompare(b.document) || a.language.localeCompare(b.language))
    : a.language.localeCompare(b.language));

  const host = document.getElementById('tableHost');
  if(!filtered.length){
    host.innerHTML = `<div style="padding:40px;text-align:center;color:var(--ink-soft);">No language versions match these filters.</div>`;
    document.getElementById('countNote').textContent = "0 versions";
    return;
  }

  function approvalCell(val){
    const v = (val||"").toString().trim();
    if(!v) return `<span class="empty-cell">&mdash;</span>`;
    return `<span class="pill green"><span class="dot"></span>${escapeHtml(v)}</span>`;
  }

  let html = `<table><thead><tr>${showAll ? '<th>Document</th>' : ''}<th>Language / version</th><th>Status</th><th>Approved by local</th><th>Approved by Pricing</th></tr></thead><tbody>`;
  filtered.forEach(r=>{
    const meta = statusMeta(r.status);
    html += `<tr>${showAll ? `<td>${r.document}</td>` : ''}<td class="lang-col">${r.language}</td><td><span class="pill ${meta.cls}"><span class="dot"></span>${meta.label}</span></td><td>${approvalCell(r.approvedLocal)}</td><td>${approvalCell(r.approvedPricing)}</td></tr>`;
  });
  html += `</tbody></table>`;
  host.innerHTML = html;
  document.getElementById('countNote').textContent = `${filtered.length} of ${records.length} versions shown`;
}

function renderAll(){
  renderDocTabs();
  renderCountryTabs();
  const pipelineRecords = activeDoc === ALL_DOCS ? DATA : DATA.filter(r=>r.document===activeDoc);
  renderPipeline(pipelineRecords);
  renderFilters();
  renderTable();
}

renderAll();
</script>
